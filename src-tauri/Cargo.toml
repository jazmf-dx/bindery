[package]
name = "bindery"
version = "0.2.0"
description = "PDF・オフィス文書・テキストを、元の場所に置いたまま整理する"
authors = ["jazmf-dx"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name (a Windows
# issue: https://github.com/rust-lang/cargo/issues/8519).
name = "bindery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: a transparent window on macOS, for the sidebar's
# translucent material (lib.rs, `main_window`).
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The window opens at the size and place it had when last closed.
tauri-plugin-window-state = "2"
# A second launch brings up the running app's window instead (lib.rs).
tauri-plugin-single-instance = "2"
# Warnings and errors into a file in the app's log folder (lib.rs, src/lib/log.ts).
tauri-plugin-log = "2"
log = "0.4"
# OS notifications for long tasks that end while the user is away (src/lib/osNotify.ts).
tauri-plugin-notification = "2"
# The app's own data (db.rs). The same crates and versions stockroom uses.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Walking a registered folder (scan.rs).
walkdir = "2.5.0"
# The hash used to find a moved file again (scan.rs, `hash_pending`).
sha2 = "0.11.0"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3.27.0"

# Copied from stockroom (desktop-platform playbook/new-tool.md).
[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

# System proxy lookup (PAC) for the updater, see proxy.rs.
[target."cfg(windows)".dependencies]
# Win32_Storage_FileSystem: a file's ID, to find it again after a move (scan.rs).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem"] }

[target."cfg(target_os = \"macos\")".dependencies]
core-foundation-sys = "0.8"
